<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nutmeg's card table</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@800&amp;family=Alegreya+Sans:wght@400;700&amp;family=Caveat:wght@600&amp;family=Courier+Prime&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.05)}}
@keyframes roll{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
.pet-in{animation:breathe ease-in-out infinite;transform-origin:bottom center}
.card{transition:transform .45s cubic-bezier(.34,1.25,.5,1),top .45s cubic-bezier(.34,1.25,.5,1),box-shadow .3s ease}
.yarn{transition:width .45s cubic-bezier(.34,1.3,.5,1),height .45s cubic-bezier(.34,1.3,.5,1)}
.yarn svg{animation:roll linear infinite}
button{font:inherit}
button:focus-visible{outline:3px solid #A4452C;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{t.bg2}}; font-family: 'Alegreya Sans', sans-serif; color: {{t.ink}}">
  <div aria-hidden="true" style="position: absolute; left: 18px; top: 24px; display: flex; align-items: center; gap: 9px; opacity: .45">
    <svg width="22" height="22" viewBox="0 0 24 24"><path d="M12 12a2 2 0 1 1 2 2a4 4 0 1 1-4-4a6 6 0 1 1 6 6a8 8 0 1 1-8-8" fill="none" stroke="{{t.accent}}" stroke-width="1.8" stroke-linecap="round"></path></svg>
    <span style="font-family: Alegreya, serif; font-weight: 800; font-size: 22px">Cinnamon</span>
  </div>

  <div role="dialog" aria-label="Model and effort for Cluster brain" style="position: absolute; left: 0; right: 0; top: 64px; bottom: 0; background: {{t.raise}}; border-radius: 28px 28px 0 0; box-shadow: 0 -18px 50px rgba(0,0,0,.18); display: flex; flex-direction: column">
    <div aria-hidden="true" style="align-self: center; width: 38px; height: 5px; border-radius: 3px; background: {{t.line}}; margin-top: 8px"></div>
    <div style="display: flex; align-items: center; padding: 6px 8px 8px 20px">
      <div style="flex: 1">
        <div style="font-family: Alegreya, serif; font-weight: 800; font-size: 22px">Model &amp; effort</div>
        <div style="font-size: 13.5px; color: {{t.ink2}}">For Cluster brain · tap a card and Nutmeg draws it</div>
      </div>
      <a href="Main.dc.html" aria-label="Close" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="{{t.ink}}" stroke-width="2" stroke-linecap="round"></path></svg>
      </a>
    </div>

    <div style="margin: 0 16px; height: 282px; border-radius: 22px; position: relative; overflow: hidden; background: {{t.plank}}; background-image: repeating-linear-gradient(90deg, transparent 0 58px, {{t.plankLine}} 58px 60px)">
      <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 170px; bottom: 0; background: {{t.table}}"></div>
      <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 162px; height: 14px; background: {{t.tableTop}}"></div>
      <div aria-hidden="true" style="position: absolute; left: 120px; right: 0; top: 162px; height: 120px; background: {{t.cloth}}; background-image: repeating-linear-gradient(90deg, transparent 0 18px, rgba(255,255,255,.14) 18px 20px), repeating-linear-gradient(0deg, transparent 0 18px, rgba(255,255,255,.14) 18px 20px)"></div>

      <sc-for list="{{models}}" as="m" hint-placeholder-count="5">
        <button class="card" aria-pressed="{{m.on}}" aria-label="{{m.name}}" onClick="{{m.pick}}" style="all: unset; cursor: pointer; box-sizing: border-box; position: absolute; left: {{m.x}}px; top: {{m.y}}px; width: 62px; height: 86px; border-radius: 6px; background: {{t.card}}; background-image: repeating-linear-gradient(180deg, transparent 0 13px, {{t.cardLine}} 13px 14px); border-top: 4px solid {{t.red}}; box-shadow: {{m.shadow}}; transform: rotate({{m.rot}}deg) scale({{m.scale}}); transform-origin: 50% 90%; z-index: {{m.z}}; padding: 6px 6px 0; color: #2B1D14">
          <span style="display: block; font-family: 'Courier Prime', monospace; font-size: 11px; line-height: 13px; background: {{t.card}}">{{m.short}}</span>
          <sc-if value="{{m.on}}" hint-placeholder-val="{{false}}">
            <svg aria-hidden="true" style="position: absolute; left: 6px; top: -16px" width="30" height="22" viewBox="0 0 30 22"><ellipse cx="15" cy="12" rx="13" ry="9" fill="#D98A47"></ellipse><circle cx="8" cy="17" r="2.2" fill="#F2A6A0"></circle><circle cx="14" cy="19" r="2.2" fill="#F2A6A0"></circle><circle cx="20" cy="17" r="2.2" fill="#F2A6A0"></circle></svg>
          </sc-if>
        </button>
      </sc-for>

      <div aria-hidden="true" style="position: absolute; left: -6px; top: 92px; width: 146px; height: 87px">
        <div class="pet-in" style="width: 146px; height: 87px; animation-duration: {{pet.dur}}s">
          <svg width="146" height="87" viewBox="-52 -50 104 62">
            <ellipse cx="2" cy="1" rx="44" ry="7" fill="rgba(0,0,0,.18)"></ellipse>
            <ellipse cx="6" cy="-16" rx="35" ry="17" fill="#D98A47"></ellipse>
            <path d="M-2 -32C0 -24 -2 -18 -6 -12M10 -33C12 -24 10 -16 6 -9M22 -30C24 -22 22 -16 18 -10" fill="none" stroke="#B86A30" stroke-width="3" stroke-linecap="round"></path>
            <path d="M-30 -2C-26 6 34 8 40 -6" fill="none" stroke="#C8783C" stroke-width="7" stroke-linecap="round"></path>
            <circle cx="-22" cy="-20" r="13.5" fill="#D98A47"></circle>
            <path d="{{pet.ears}}" fill="#D98A47"></path>
            <path d="M-30 -30L-30.5 -36L-26 -31ZM-17 -32L-14 -37L-14 -30Z" fill="#F2A6A0"></path>
            <path d="{{pet.eyes}}" fill="none" stroke="#4A2A14" stroke-width="1.5" stroke-linecap="round"></path>
            <path d="M-24 -15L-22 -13L-20 -15Z" fill="#E88A86"></path>
          </svg>
        </div>
      </div>
      <div class="yarn" aria-hidden="true" style="position: absolute; left: 82px; bottom: 96px; width: {{yarn.d}}px; height: {{yarn.d}}px; transform: translateY(50%)">
        <svg width="100%" height="100%" viewBox="-20 -20 40 40" style="animation-duration: {{yarn.dur}}s"><circle r="19" fill="#7FA0C4"></circle><path d="M-17 -6C-6 -14 8 -14 17 -4M-18 4C-4 -6 10 -6 18 6M-12 14C-2 6 8 6 13 14M-6 -18C-12 -4 -10 10 -2 18" fill="none" stroke="#5E7FA6" stroke-width="2.2" stroke-linecap="round"></path></svg>
      </div>
    </div>

    <div style="padding: 12px 20px 0; display: flex; flex-direction: column; gap: 0" aria-live="polite">
      <div style="font-family: Caveat, cursive; font-weight: 600; font-size: 22px; line-height: 26px">“{{line}}”</div>
      <div style="font-size: 12.5px; line-height: 17px; color: {{t.ink2}}"><b style="font-weight: 600; color: {{t.ink}}">{{modelName}}</b>{{rec}} · {{modelDesc}}</div>
    </div>

    <div role="group" aria-label="Assistant" style="margin: 12px 20px 0; display: flex; gap: 6px; padding: 4px; border-radius: 26px; background: {{t.well}}">
      <sc-for list="{{clis}}" as="c" hint-placeholder-count="3">
        <button aria-pressed="{{c.on}}" onClick="{{c.pick}}" style="all: unset; cursor: pointer; flex: 1; height: 48px; border-radius: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; line-height: 17px; font-weight: 700; font-size: 15px; background: {{c.bg}}; color: {{c.fg}}">{{c.label}}<span style="font-size: 11px; font-weight: 400; opacity: .72">{{c.maker}}</span></button>
      </sc-for>
    </div>

    <div style="margin: 14px 20px 0">
      <div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 6px">
        <span style="font-size: 12.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: {{t.ink3}}">How hard it thinks</span>
        <span style="font-size: 13.5px; color: {{t.ink2}}">{{effortNote}}</span>
      </div>
      <div role="group" aria-label="Effort" style="display: flex; gap: 6px">
        <sc-for list="{{efforts}}" as="e" hint-placeholder-count="3">
          <button aria-pressed="{{e.on}}" aria-label="{{e.label}}" onClick="{{e.pick}}" style="all: unset; cursor: pointer; flex: 1; height: 44px; border-radius: 14px; text-align: center; line-height: 44px; font-size: 11.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border: 1px solid {{e.border}}; background: {{e.bg}}; color: {{e.fg}}">{{e.short}}</button>
        </sc-for>
      </div>
      <div style="margin-top: 7px; font-size: 12.5px; line-height: 17px; color: {{t.ink2}}">{{hint}}</div>
    </div>

    <div style="margin: auto 20px 18px; display: flex; flex-direction: column; gap: 8px">
      <a href="Main.dc.html" style="height: 50px; border-radius: 25px; background: {{t.ink}}; color: {{t.raise}}; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; text-decoration: none">Use for this thread</a>
      <div style="font-size: 13px; line-height: 17px; text-align: center; color: {{t.ink3}}">Starts with your next message. Changing assistant keeps the whole conversation.</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"night":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { cli: 'agy', model: 'gemini-4-argon', effort: 'medium' }; }
  data() {
    const E5 = ['low', 'medium', 'high', 'xhigh', 'max'], E6 = E5.concat(['ultra']), E3 = ['low', 'medium', 'high'];
    return {
      claude: { label: 'Claude', def: 'opus', models: [
        { id: 'fable', name: 'Fable 5.1', short: 'Fable 5.1', efforts: E5, desc: "Most capable. Slowest, uses the most quota." }, { id: 'opus', name: 'Opus 5.5', short: 'Opus 5.5', efforts: E5, desc: "Very capable all-rounder for hard work." },
        { id: 'sonnet', name: 'Sonnet 5.5', short: 'Sonnet 5.5', efforts: E5, desc: "Fast and capable for everyday work." }, { id: 'haiku', name: 'Haiku 4.5', short: 'Haiku 4.5', efforts: E5, desc: "Fastest and lightest, for quick asks." }] },
      codex: { label: 'Codex', def: 'gpt-6-astra', models: [
        { id: 'gpt-6.1-sol', name: 'GPT-6.1-Sol', short: '6.1 Sol', efforts: E6, desc: "Newest and most capable." }, { id: 'gpt-6-astra', name: 'GPT-6-Astra', short: '6 Astra', efforts: E6, desc: "Strong all-rounder." },
        { id: 'gpt-6-sol', name: 'GPT-6-Sol', short: '6 Sol', efforts: E6, desc: "Capable, one step older." }, { id: 'gpt-6-luna', name: 'GPT-6-Luna', short: '6 Luna', efforts: E5, desc: "Lighter and faster." },
        { id: 'gpt-5.6-sol', name: 'GPT-5.6-Sol', short: '5.6 Sol', efforts: E6, desc: "Previous generation, capable." }, { id: 'gpt-5.6-terra', name: 'GPT-5.6-Terra', short: '5.6 Terra', efforts: E6, desc: "Previous generation, balanced." },
        { id: 'gpt-5.6-luna', name: 'GPT-5.6-Luna', short: '5.6 Luna', efforts: E5, desc: "Previous generation, lightest." }] },
      agy: { label: 'Antigravity', def: 'gemini-4-argon', models: [
        { id: 'gemini-4-argon', name: 'Gemini 4 Argon', short: 'Argon 4', efforts: E3, desc: "Google's most capable." }, { id: 'gemini-3.8-flash', name: 'Gemini 3.8 Flash', short: 'Flash 3.8', efforts: E3, desc: "Fast and light." },
        { id: 'claude-opus-5-5', name: 'Claude Opus 5.5', short: 'Opus 5.5', efforts: E3, desc: "Claude Opus, run through Antigravity." }, { id: 'claude-sonnet-5-5', name: 'Claude Sonnet 5.5', short: 'Sonnet 5.5', efforts: E3, desc: "Claude Sonnet, run through Antigravity." },
        { id: 'gpt-oss-120b', name: 'GPT-OSS 120B', short: 'OSS 120B', efforts: ['medium'], desc: "Open model with one setting." }] },
    };
  }
  keep(efforts, want) { return efforts.includes(want) ? want : efforts.includes('medium') ? 'medium' : efforts[0]; }
  renderVals() {
    const night = this.props.night ?? false;
    const t = night
      ? { ink: '#F1E4D0', ink2: '#CDB9A0', ink3: '#A8927A', raise: '#2A1F18', bg2: '#3A2C22', line: 'rgba(241,228,208,.18)', accent: '#E58B5A', well: 'rgba(241,228,208,.08)', plank: '#4A3322', plankLine: '#3B281A', card: '#EFE6D4', cardLine: '#7A93A8', red: '#B5473D', table: '#5A3820', tableTop: '#704729', cloth: '#8E3530' }
      : { ink: '#2B1D14', ink2: '#5A4636', ink3: '#76604C', raise: '#FAF4EA', bg2: '#EFE2CD', line: 'rgba(43,29,20,.14)', accent: '#A4452C', well: '#EFE2CD', plank: '#D8B88C', plankLine: '#C29E70', card: '#FFFDF7', cardLine: '#A9C7E2', red: '#D2564A', table: '#9A6438', tableTop: '#B47A48', cloth: '#C8473D' };
    const D = this.data(), s = this.state, cli = D[s.cli];
    const model = cli.models.find((m) => m.id === s.model) || cli.models[0];
    const effort = this.keep(model.efforts, s.effort);
    const idx = model.efforts.indexOf(effort), n = model.efforts.length;
    const frac = n === 1 ? 0.5 : idx / (n - 1), tier = Math.round(frac * 3);
    const N = cli.models.length, mid = (N - 1) / 2, spread = Math.min(42, 180 / Math.max(1, N - 1));
    const models = cli.models.map((m, i) => {
      const on = m.id === model.id, d = i - mid;
      return { ...m, on, x: 200 + d * spread, y: on ? 150 : 70 + Math.abs(d) * 5, rot: on ? 0 : d * 7, scale: on ? 1.08 : 1, z: on ? 20 : i + 1,
        shadow: on ? '0 14px 22px rgba(0,0,0,.28)' : '0 4px 8px rgba(0,0,0,.16)',
        pick: () => this.setState({ model: m.id, effort: this.keep(m.efforts, effort) }) };
    });
    const alert = tier >= 2;
    const pet = { dur: [4.6, 3.4, 2.2, 1.3][tier],
      ears: alert ? 'M-33 -27L-34 -42L-23 -31ZM-18 -31L-12 -44L-10 -28Z' : 'M-34 -28L-37 -38L-26 -31ZM-20 -32L-15 -40L-12 -29Z',
      eyes: tier === 0 ? 'M-31 -20Q-28 -17 -25 -20M-21 -21Q-18 -18 -15 -21' : 'M-29 -22a2 2.4 0 1 0 .1 0M-19 -22.5a2 2.4 0 1 0 .1 0' };
    const yarn = { d: Math.round(22 + frac * 34), dur: [9, 6, 3.5, 1.8][tier] };
    const SHORT = { low: 'Quick', medium: 'Balanced', high: 'Thorough', xhigh: 'Deep', max: 'Deepest', ultra: 'All out' };
    const LONG = { low: 'Quick', medium: 'Balanced', high: 'Thorough', xhigh: 'Deep', max: 'Deepest', ultra: 'All out' };
    const HINT = { low: 'Fast replies for simple asks. Uses the least quota.', medium: 'A good default for most things.', high: 'Takes longer on tricky work.', xhigh: 'For hard problems. Slower.', max: 'Its very best. Slowest, uses the most quota.', ultra: 'Beyond Deepest. Only some Codex models have it.' };
    const efforts = model.efforts.map((e) => { const on = e === effort; return { label: LONG[e], short: SHORT[e], on,
      bg: on ? t.accent : 'transparent', fg: on ? t.raise : t.ink, border: on ? t.accent : t.line, pick: () => this.setState({ effort: e }) }; });
    const clis = ['claude', 'codex', 'agy'].map((k) => { const on = k === s.cli; return { label: D[k].label, maker: { claude: 'by Anthropic', codex: 'by OpenAI', agy: 'by Google' }[k], on, bg: on ? t.ink : 'transparent', fg: on ? t.raise : t.ink,
      pick: () => { const m = D[k].models.find((x) => x.id === D[k].def); this.setState({ cli: k, model: m.id, effort: this.keep(m.efforts, effort) }); } }; });
    const LINES = ['Curled up, paws tucked in.', 'Sitting up, one paw on the card.', 'Ears up, ready to pounce.', 'Pouncing on the whole deck.'];
    return { t, models, pet, yarn, efforts, clis, line: LINES[tier], summary: `${cli.label} · ${model.name} · ${LONG[effort]}`, modelName: model.name, modelDesc: model.desc, rec: model.id === cli.def ? ' (recommended)' : '', hint: n === 1 ? 'This model has one setting.' : HINT[effort],
      effortNote: n === 1 ? 'One setting only' : 'The bigger the yarn, the harder it thinks' };
  }
}
</script>
</body>
</html>
