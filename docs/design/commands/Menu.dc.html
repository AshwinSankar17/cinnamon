<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Menu with model and effort</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono&amp;family=Fraunces:wght@600&amp;family=Instrument+Sans:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
@keyframes peek{0%,70%,100%{transform:translateY(0) rotate(0)}76%{transform:translateY(-6px) rotate(-6deg)}84%{transform:translateY(0) rotate(0)}}
.peek{animation:peek 3.2s ease-in-out infinite;transform-origin:bottom center}
.row:hover{filter:brightness(.97)}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{t.bg2}}; font-family: 'Instrument Sans', sans-serif; color: {{t.ink}}">
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 520px; background: linear-gradient(180deg, {{t.wall}} 0%, {{t.bg2}} 100%)"></div>
  <div aria-hidden="true" style="position: absolute; left: 18px; top: 30px; font-family: Fraunces, serif; font-weight: 600; font-size: 23px; opacity: .5">Cinnamon</div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(10,6,4,.22)"></div>

  <div role="dialog" aria-label="Menu" style="position: absolute; left: 0; right: 0; bottom: 0; height: 690px; background: {{t.raise}}; border-radius: 30px 30px 0 0; padding: 10px 14px 0; box-sizing: border-box; box-shadow: 0 -6px 20px rgba(0,0,0,.12)">
    <div aria-hidden="true" style="width: 40px; height: 5px; border-radius: 3px; background: {{t.line}}; margin: 0 auto"></div>
    <div style="display: flex; align-items: center; min-height: 50px">
      <div style="flex: 1; padding-left: 4px; font-family: Fraunces, serif; font-weight: 600; font-size: 26px">Menu</div>
      <a href="Main.dc.html" style="min-height: 44px; padding: 0 10px; display: flex; align-items: center; font-weight: 600; font-size: 14px">Done</a>
    </div>

    <a class="row" href="Crumb.dc.html" aria-label="Model and effort for Cluster brain: Claude, Opus 5.5, thinks Thorough. Change" style="display: flex; align-items: center; gap: 12px; margin: 4px 0 10px; padding: 12px 12px 12px 14px; border-radius: 20px; background: {{t.tint}}; border: 1px solid {{t.line}}">
      <div style="flex: 1; display: flex; flex-direction: column; gap: 3px">
        <span style="font-weight: 600; font-size: 15.5px">Model &amp; effort</span>
        <span style="font-size: 13px; line-height: 18px; color: {{t.ink2}}">Cluster brain uses <b style="font-weight: 600; color: {{t.ink}}">Claude Opus 5.5</b> and thinks <b style="font-weight: 600; color: {{t.ink}}">Thorough</b>.</span>
        <span style="font-size: 12px; color: {{t.accent}}; font-weight: 600">Change how it thinks</span>
      </div>
      <div class="peek" aria-hidden="true" style="width: 58px; height: 40px">
        <svg width="58" height="40" viewBox="-40 -48 76 52">
          <path d="M14 -18L36 -27L31 -13Z" fill="#7A5236"></path>
          <ellipse cx="2" cy="-18" rx="18" ry="13" fill="#A8774E"></ellipse>
          <ellipse cx="-4" cy="-13" rx="12" ry="8" fill="#EEDCC3"></ellipse>
          <path d="M-2 -25C10 -29 21 -22 18 -11C10 -13 2 -16 -2 -25Z" fill="#7E5434"></path>
          <circle cx="-14" cy="-32" r="10" fill="#9A6A44"></circle>
          <path d="M-23.5 -35C-21 -44 -8 -45 -5 -36C-10 -38.5 -17 -38.5 -23.5 -35Z" fill="#6E4A2E"></path>
          <circle cx="-17" cy="-28.5" r="3.6" fill="#EEDCC3"></circle>
          <circle cx="-17" cy="-33" r="2.3" fill="#1A120D"></circle>
          <circle cx="-17.8" cy="-33.8" r="0.75" fill="#fff"></circle>
          <path d="M-24 -32.5L-32 -30.5L-24 -28.3Z" fill="#E7A93E"></path>
          <path d="M-3 -6V0M4 -6V0" stroke="#C78A4A" stroke-width="1.8" stroke-linecap="round"></path>
        </svg>
      </div>
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="{{t.ink3}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </a>

    <sc-for list="{{rows}}" as="r" hint-placeholder-count="9">
      <div style="display: flex; align-items: center; gap: 14px; min-height: 52px; padding: 0 6px; border-top: 1px solid {{t.line}}">
        <div style="flex: 1; display: flex; flex-direction: column; gap: 1px">
          <span style="font-weight: 600; font-size: 15.5px">{{r.title}}</span>
          <span style="font-family: 'DM Mono', monospace; font-size: 11px; color: {{t.ink2}}">{{r.detail}}</span>
        </div>
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="{{t.ink3}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"night":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const night = this.props.night ?? false;
    const t = night
      ? { ink: '#F6E8D6', ink2: '#D0BBA5', ink3: '#AA937E', raise: '#2C2019', bg2: '#3A2B21', line: 'rgba(246,232,214,.13)', accent: '#F0A35E', tint: 'rgba(240,163,94,.12)', wall: '#2A1F18' }
      : { ink: '#2A1A10', ink2: '#5E4636', ink3: '#7D6756', raise: '#FFFBF5', bg2: '#F3E6D4', line: 'rgba(42,26,16,.12)', accent: '#B4561F', tint: '#FBEEE2', wall: '#F7E7D0' };
    const rows = [
      ['World', 'Bakery · matches phone'], ['Companion', 'Crumb the sparrow'], ['Quota', 'claude 41% of 5h'],
      ['Rules', '12 rules Brain enforces'], ['This phone', 'Pixel · sign out'], ['Quiet hours', '22:00–07:00 · approvals still ring'],
      ['Inbox', 'everything waiting for you'], ['Threads', 'every thread, by repo'], ['Jobs', 'SLURM jobs and their logs'],
    ].map(([title, detail]) => ({ title, detail }));
    return { t, rows };
  }
}
</script>
</body>
</html>
